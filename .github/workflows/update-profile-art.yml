name: Update Moonshade profile activity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile-art.yml'
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py
      - name: Render Moonshade cards
        run: python scripts/render_profile.py
      - name: Commit current activity cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json cards/heatmap.svg cards/streak.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified contribution cards'
            git push
          fi
