name: Refresh profile activity
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py
      - name: Render animated SVG cards
        run: python scripts/render_cards.py
      - name: Commit refreshed data and cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json cards/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile cards [skip ci]'
            git push
          fi
