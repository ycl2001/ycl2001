
    <svg xmlns="http://www.w3.org/2000/svg" width="1000" height="327" viewBox="0 0 1000 327" role="img" aria-labelledby="title desc">
    <title id="title">GitHub yearly activity</title><desc id="desc">Actual contribution totals, monthly bar chart and streak statistics</desc>
    <defs>
      <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F7F9"/><stop offset="1" stop-color="#ECEEF3"/></linearGradient>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D1E33"/><stop offset="1" stop-color="#292A47"/></linearGradient>
      <linearGradient id="twilight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3A385E"/><stop offset="1" stop-color="#44436C"/></linearGradient>
      <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#585183"/><stop offset="1" stop-color="#68639F"/></linearGradient>
      <style><![CDATA[
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
      @keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes gleam{0%,100%{opacity:.55}50%{opacity:.86}}
      @keyframes grow{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
      .fade{animation:appear .85s ease-out both}
      .glow{animation:gleam 6s ease-in-out infinite}
      .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .8s ease-out both}
      @media (prefers-reduced-motion:reduce){.fade,.glow,.bar{animation:none!important;opacity:1!important;transform:none!important}}
      ]]></style>
    </defs>
    <rect x="1" y="1" width="998" height="325" rx="22" fill="url(#surface)" stroke="#D9DEE8"/>
    <text x="44" y="44" fill="#8A90A3" font-size="12" font-weight="700" letter-spacing="2">THE LAST 12 MONTHS ON GITHUB</text><text x="44" y="113" fill="#171827" font-size="55" font-weight="400" font-family="Georgia, Times New Roman, serif" >483</text><text x="145" y="113" fill="#171827" font-size="52" font-family="Georgia, Times New Roman, serif" font-style="italic">contributions</text><rect x="47" y="274" width="34" height="4" rx="4" fill="#171827" class="bar"/><text x="51" y="303" fill="#64697C" font-size="11" >Dec</text><rect x="97" y="274" width="34" height="4" rx="4" fill="#171827" class="bar"/><text x="101" y="303" fill="#64697C" font-size="11" >Jan</text><rect x="147" y="274" width="34" height="4" rx="4" fill="#171827" class="bar"/><text x="151" y="303" fill="#64697C" font-size="11" >Feb</text><rect x="197" y="274" width="34" height="4" rx="4" fill="#171827" class="bar"/><text x="201" y="303" fill="#64697C" font-size="11" >Mar</text><rect x="247" y="227.8" width="34" height="50.2" rx="4" fill="#171827" class="bar"/><text x="251" y="303" fill="#64697C" font-size="11" >Apr</text><rect x="297" y="218.6" width="34" height="59.4" rx="4" fill="#171827" class="bar"/><text x="301" y="303" fill="#64697C" font-size="11" >May</text><rect x="347" y="268.8" width="34" height="9.2" rx="4" fill="#171827" class="bar"/><text x="351" y="303" fill="#64697C" font-size="11" >Jun</text><rect x="397" y="274" width="34" height="4" rx="4" fill="#171827" class="bar"/><text x="401" y="303" fill="#64697C" font-size="11" >Jul</text><rect x="447" y="274" width="34" height="4" rx="4" fill="#171827" class="bar"/><text x="451" y="303" fill="#64697C" font-size="11" >Aug</text><rect x="497" y="174.7" width="34" height="103.3" rx="4" fill="#171827" class="bar"/><text x="501" y="303" fill="#64697C" font-size="11" >Sep</text><rect x="547" y="173.1" width="34" height="104.9" rx="4" fill="#171827" class="bar"/><text x="551" y="303" fill="#64697C" font-size="11" >Oct</text><rect x="597" y="165.0" width="34" height="113.0" rx="4" fill="#625BCD" class="bar"/><text x="601" y="303" fill="#64697C" font-size="11" >Nov</text><path d="M673 42 V306" stroke="#D9DEE8" stroke-width="1"/><text x="704" y="100" fill="#171827" font-size="32" font-weight="400" font-family="Georgia, Times New Roman, serif" >4 days</text><text x="705" y="124" fill="#64697C" font-size="16" >current streak · 6 longest</text><path d="M704 143 H952" stroke="#D4D8E1"/><text x="704" y="190" fill="#171827" font-size="32" font-weight="400" font-family="Georgia, Times New Roman, serif" >43 / 370</text><text x="705" y="214" fill="#64697C" font-size="16" >days with contributions</text><path d="M704 233 H952" stroke="#D4D8E1"/><text x="704" y="280" fill="#171827" font-size="32" font-weight="400" font-family="Georgia, Times New Roman, serif" >47</text><text x="705" y="304" fill="#64697C" font-size="16" >on the busiest day</text>
    </svg>
