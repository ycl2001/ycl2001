<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="205" viewBox="0 0 1000 205" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16172a"/><stop offset="1" stop-color="#0c0d17"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8def8"/><stop offset=".6" stop-color="#9889ef"/><stop offset="1" stop-color="#8bbce7"/></linearGradient><style><![CDATA[
    text{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    
    @keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes breathe{0%,100%{opacity:.42}50%{opacity:.9}}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes grow{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
    .fade{opacity:0;animation:appear .8s cubic-bezier(.2,.7,.2,1) forwards}
    .float{animation:float 6s ease-in-out infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    .line{stroke-dasharray:500;animation:draw 2.2s ease forwards}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .8s ease-out both}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
    
    ]]></style></defs><rect x="1" y="1" width="998" height="203" rx="22" fill="url(#bg)" stroke="#41425c" stroke-opacity=".8"/><rect x="25" y="25" width="6" height="155" rx="3" fill="#9e91fa"/><text x="52" y="51" font-size="13" fill="#9e91fa" font-weight="700" class="" >MACOS · PRODUCT ENGINEERING</text><text x="52" y="93" font-size="32" fill="#e5e7f0" font-weight="700" class="fade" style="animation-delay:.14s">Project Reporting Builder</text><text x="52" y="124" font-size="18" fill="#cbd2e9" font-weight="400" class="" >Transform project updates and metrics into reusable reports,</text><text x="52" y="151" font-size="18" fill="#cbd2e9" font-weight="400" class="" >with native export, accessible cards and local history.</text><text x="52" y="182" font-size="13" fill="#a5acc5" font-weight="550" class="" >SwiftUI  ·  Swift Testing  ·  XCTest</text><path d="M895 80 L950 80 L950 135" fill="none" stroke="#67688b" stroke-width="2" class="line"/><text x="937" y="165" font-size="32" fill="#9e91fa" font-weight="600" class="" >+</text></svg>