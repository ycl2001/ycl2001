<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16172a"/><stop offset="1" stop-color="#0c0d17"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8def8"/><stop offset=".6" stop-color="#9889ef"/><stop offset="1" stop-color="#8bbce7"/></linearGradient><style><![CDATA[
    text{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    
    @keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes breathe{0%,100%{opacity:.42}50%{opacity:.9}}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes grow{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
    .fade{opacity:0;animation:appear .8s cubic-bezier(.2,.7,.2,1) forwards}
    .float{animation:float 6s ease-in-out infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    .line{stroke-dasharray:500;animation:draw 2.2s ease forwards}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .8s ease-out both}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
    
    ]]></style></defs><rect x="1" y="1" width="998" height="258" rx="22" fill="url(#bg)" stroke="#41425c" stroke-opacity=".8"/><text x="38" y="47" font-size="15" fill="#9e91fa" font-weight="700" class="" >CONTRIBUTION ACTIVITY</text><text x="38" y="84" font-size="30" fill="#e5e7f0" font-weight="700" class="" >A year of building</text><text x="39" y="130" font-size="19" fill="#cbd2e9" font-weight="400" class="" >Live activity lives on GitHub. No estimated counts or synthetic data.</text><text x="39" y="167" font-size="16" fill="#a5acc5" font-weight="400" class="" >Run the included GitHub Action to populate monthly bars with real activity.</text><path d="M42 205 H956" stroke="#474967" stroke-dasharray="8 8"/></svg>