<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16172a"/><stop offset="1" stop-color="#0c0d17"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8def8"/><stop offset=".6" stop-color="#9889ef"/><stop offset="1" stop-color="#8bbce7"/></linearGradient><style><![CDATA[
    text{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    
    @keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes breathe{0%,100%{opacity:.42}50%{opacity:.9}}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes grow{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
    .fade{opacity:0;animation:appear .8s cubic-bezier(.2,.7,.2,1) forwards}
    .float{animation:float 6s ease-in-out infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    .line{stroke-dasharray:500;animation:draw 2.2s ease forwards}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .8s ease-out both}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
    
    ]]></style></defs><rect x="1" y="1" width="998" height="343" rx="22" fill="url(#bg)" stroke="#41425c" stroke-opacity=".8"/><circle cx="845" cy="155" r="120" fill="none" stroke="#6665ad" stroke-width="1.4" opacity=".55"/><circle cx="845" cy="155" r="94" fill="none" stroke="#a49be7" opacity=".6" stroke-dasharray="4 7"/><circle cx="845" cy="155" r="68" fill="#2f3053"/><circle cx="864" cy="143" r="64" fill="#151629"/><path d="M785 257 Q845 280 908 255" fill="none" stroke="#a99ef4" stroke-width="2" class="line"/><circle cx="845" cy="155" r="130" fill="none" stroke="#7775b6" stroke-dasharray="1 15" opacity=".45" class="breathe"/><text x="46" y="57" font-size="14" fill="#9e91fa" font-weight="700" class="fade" style="animation-delay:.05s">PRODUCT THINKING  /  SOFTWARE ENGINEERING</text><text x="46" y="124" font-size="59" fill="#e5e7f0" font-weight="750" class="fade" style="animation-delay:.15s">Hi, I&#x27;m Selina.</text><text x="48" y="171" font-size="19" fill="#cbd2e9" font-weight="450" class="fade" style="animation-delay:.30s">Yen-Chun Liu  ·  Sydney, Australia</text><text x="48" y="224" font-size="21" fill="#e5e7f0" font-weight="450" class="fade" style="animation-delay:.43s">I turn complex problems into thoughtful, testable software.</text><text x="48" y="264" font-size="17" fill="#a5acc5" font-weight="450" class="fade" style="animation-delay:.55s">SwiftUI   /   Privacy-aware AI   /   Data products</text><rect x="46" y="290" width="313" height="33" rx="16" fill="#27273e" stroke="#535273"/><text x="63" y="312" font-size="12" fill="#cbd2e9" font-weight="650" class="" >DISCOVER  /  DESIGN  /  BUILD  /  TEST</text></svg>